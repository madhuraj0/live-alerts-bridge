plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.livealert.bridge'
    compileSdk 34

    defaultConfig {
        minSdk 26
        targetSdk 34
        versionCode 16
        versionName "1.8.1"
    }

    // Signing credentials live in keystore.properties (git-ignored) or env vars:
    // storeFile, storePassword, keyAlias, keyPassword / LIVEALERT_STORE_FILE, ...
    def keystoreProps = new Properties()
    def keystorePropsFile = rootProject.file('keystore.properties')
    if (keystorePropsFile.exists()) keystorePropsFile.withInputStream { keystoreProps.load(it) }
    def signProp = { String k, String env -> keystoreProps.getProperty(k) ?: System.getenv(env) }
    def hasReleaseKey = signProp('storeFile', 'LIVEALERT_STORE_FILE') != null

    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(signProp('storeFile', 'LIVEALERT_STORE_FILE'))
                storePassword signProp('storePassword', 'LIVEALERT_STORE_PASSWORD')
                keyAlias signProp('keyAlias', 'LIVEALERT_KEY_ALIAS') ?: 'livealert'
                keyPassword signProp('keyPassword', 'LIVEALERT_KEY_PASSWORD')
            }
        }
    }

    flavorDimensions = ["targetIdentity"]
    productFlavors {
        appleMusic {
            dimension "targetIdentity"
            applicationId "com.apple.android.music"
            versionNameSuffix "-appleMusic"
            manifestPlaceholders = [appName: "Live Alerts Bridge (Apple Music Identity)"]
        }
        spotify {
            dimension "targetIdentity"
            applicationId "com.spotify.music"
            versionNameSuffix "-spotify"
            manifestPlaceholders = [appName: "Live Alerts Bridge (Spotify Identity)"]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.preference:preference-ktx:1.2.1'
}
